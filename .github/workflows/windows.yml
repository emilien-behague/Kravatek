name: Windows universal lab 0.4

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'KRAVATEK-KICK-LAB/docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'KRAVATEK-KICK-LAB/docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: KRAVATEK-KICK-LAB
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain versions
        run: |
          cmake --version
          git --version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
      - name: Configure MSVC x64
        run: cmake --preset windows-x64
      - name: Build Release
        run: |
          cmake --build --preset windows-release 2>&1 | Tee-Object -FilePath build/windows-x64/msvc-build.log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            Select-String -Path build/windows-x64/msvc-build.log -Pattern 'error [A-Z]+[0-9]+|fatal error|CMake Error' | Select-Object -First 12 | ForEach-Object {
              $message = $_.Line.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error::$message"
            }
            exit $buildExit
          }
      - name: DSP, genetic populations, persistence and WAV tests
        run: ctest --preset windows-release --output-junit test-results-004.xml
      - name: Independent PCM24 and exact recall checks
        run: python tools/validate_genetic_exports.py --renderer build/windows-x64/Release/krava-genome-render.exe --output build/windows-x64/independent-exports
      - name: Universal PCM24 and exact profile recall
        run: python tools/validate_genetic_exports.py --renderer build/windows-x64/Release/krava-genome-render.exe --output build/windows-x64/universal-exports --universal
      - name: GUI functional test
        run: |
          $process = Start-Process -FilePath "build/windows-x64/Release/KravaKickLab.exe" -ArgumentList '--smoke-test build/windows-x64/gui-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            $detail = 'No failure detail written'
            if (Test-Path build/windows-x64/gui-smoke/gui-failure.txt) { $detail = Get-Content build/windows-x64/gui-smoke/gui-failure.txt -Raw }
            $message = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::GUI: $message"
            throw "GUI smoke test failed: $($process.ExitCode): $detail"
          }
          $report = Get-Content build/windows-x64/gui-smoke/gui-smoke.json | ConvertFrom-Json
          if ($report.result -ne 'passed') { throw 'GUI report missing or failed' }
          if ($report.applicationVersion -ne '0.4.1' -or $report.styleDropdownActions -ne 18 -or $report.styleSelectionAuditions -ne 17 -or !$report.styleSelectionChangesAudio -or !$report.playingBufferFollowsSelectionAndGeneration) {
            throw 'Style selection / playback regression was not verified'
          }
          if ($report.previewAudioBackend -eq 'offline-playback-test') {
            if ($report.audioDeviceActive -or $report.offlinePlaybackBlocks -le 0) { throw 'Invalid offline Playback report' }
          } elseif ($report.previewAudioBackend -ne 'device' -or !$report.audioDeviceActive) {
            throw 'Missing preview test backend'
          }
      - name: Package instrument, genetic session and listening examples
        run: |
          New-Item -ItemType Directory -Force build/package | Out-Null
          Copy-Item build/windows-x64/Release/KravaKickLab.exe build/package/
          Copy-Item build/windows-x64/Release/krava-render.exe build/package/
          Copy-Item build/windows-x64/Release/krava-genome-render.exe build/package/
          New-Item -ItemType Directory -Force build/package/Profiles | Out-Null
          Copy-Item profiles/core-004.json build/package/Profiles/
          Copy-Item docs/WINDOWS-GUIDE.md build/package/LIRE-MOI.md
          New-Item -ItemType Directory -Force build/package/Examples | Out-Null
          New-Item -ItemType Directory -Force build/package/Examples/Classic | Out-Null
          New-Item -ItemType Directory -Force build/package/Examples/Universal | Out-Null
          Copy-Item build/windows-x64/test-output/universal-reference/* build/package/Examples/Universal/
          foreach ($style in @('reference', 'hard-techno', 'hard-psy', 'schranz', 'hardcore', 'deep', 'experimental', 'mutant')) {
            & build/windows-x64/Release/krava-render.exe --style $style --seed 1 --output "build/package/Examples/Classic/$style.wav"
            if ($LASTEXITCODE -ne 0) { throw "WAV generation failed: $style" }
          }
          foreach ($mode in @('deep', 'hard-psy', 'schranz', 'experimental', 'mutant')) {
            & build/windows-x64/Release/krava-genome-render.exe --mode $mode --seed 1 --novelty .75 --output "build/package/Examples/$mode.wav"
            if ($LASTEXITCODE -ne 0) { throw "Genetic WAV generation failed: $mode" }
          }
          New-Item -ItemType Directory -Force build/package/Examples/Experimental-20 | Out-Null
          & build/windows-x64/Release/krava-genome-render.exe --mode experimental --seed 778899 --novelty .75 --batch 20 --output build/package/Examples/Experimental-20/kick.wav
          if ($LASTEXITCODE -ne 0) { throw 'Experimental population failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KRAVA-KICK-LAB-Windows-x64
          path: KRAVATEK-KICK-LAB/build/package/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Windows-test-results
          path: |
            KRAVATEK-KICK-LAB/build/windows-x64/msvc-build.log
            KRAVATEK-KICK-LAB/build/windows-x64/Testing/
            KRAVATEK-KICK-LAB/test-results-004.xml
            KRAVATEK-KICK-LAB/build/windows-x64/test-output/genetic-100-report.json
            KRAVATEK-KICK-LAB/build/windows-x64/gui-smoke/
            KRAVATEK-KICK-LAB/build/windows-x64/independent-exports/validation.json
            KRAVATEK-KICK-LAB/build/windows-x64/universal-exports/validation.json
            KRAVATEK-KICK-LAB/build/windows-x64/test-output/universal-reference/*.csv
